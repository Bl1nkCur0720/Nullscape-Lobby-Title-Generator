<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nullscape Lobby Generator</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="app" id="app">

        <header class="app-header">
            <div class="header-content">
                <div class="header-brand">
                    <span class="brand-icon">✦</span>
                    <div>
                        <h1 data-i18n="brandTitle">Nullscape Lobby Title Generator</h1>
                        <p class="header-sub" data-i18n="brandSub">为 Nullscaper 生成更好的大厅标题</p>
                    </div>
                </div>
                <!-- 语言切换按钮 - 新样式 -->
                <button class="lang-toggle" id="langToggle" aria-label="切换语言" title="切换语言 / Toggle Language">
                    <span class="lang-icon">🌐</span>
                    <span class="lang-text" id="langLabel">中文</span>
                </button>
            </div>
        </header>

        <main class="app-main">

            <!-- 左侧控制面板 -->
            <aside class="control-panel">

                <!-- 文本输入 -->
                <section class="control-section">
                    <label class="section-label" for="textInput" data-i18n="textLabel">文本内容</label>
                    <div class="input-group">
                        <input type="text" id="textInput" class="input-text" value="ENDURANCE" placeholder="输入要渐变的文本..." data-i18n-placeholder="textPlaceholder" />
                        <span class="input-char-count" id="charCount">9</span>
                    </div>
                </section>

                <!-- 文本颜色 -->
                <section class="control-section color-section">
                    <label class="section-label" data-i18n="textColorLabel">文本颜色</label>
                    <div class="color-pickers">
                        <div class="color-picker-group">
                            <label class="color-label" for="textStartColor" data-i18n="startColorLabel">起始色</label>
                            <input type="color" id="textStartColor" class="color-picker" value="#87292B" />
                            <input type="text" class="color-hex" id="textStartColorHex" value="#87292B" />
                        </div>
                        <div class="color-picker-group">
                            <label class="color-label" for="textEndColor" data-i18n="endColorLabel">结束色</label>
                            <input type="color" id="textEndColor" class="color-picker" value="#F54B4E" />
                            <input type="text" class="color-hex" id="textEndColorHex" value="#F54B4E" />
                        </div>
                    </div>
                    <div class="gradient-preview" id="textGradientPreview" style="background: linear-gradient(90deg, #87292B, #F54B4E);"></div>
                    <div class="mode-button-group" id="textModeGroup">
                        <button class="mode-btn" data-mode="solid" data-i18n="solid">纯色</button>
                        <button class="mode-btn active" data-mode="gradient" data-i18n="gradient">渐变</button>
                        <button class="mode-btn" data-mode="rainbow" data-i18n="rainbow">🌈 彩虹</button>
                    </div>
                </section>

                <!-- 描边设置 -->
                <section class="control-section stroke-section">
                    <div class="stroke-header">
                        <label class="section-label" style="margin-bottom:0;" data-i18n="strokeSettings">描边设置</label>
                        <label class="toggle-item toggle-sm">
                            <span class="toggle-label" data-i18n="enable">启用</span>
                            <input type="checkbox" class="toggle-input" id="optStroke" />
                            <span class="toggle-track"></span>
                        </label>
                    </div>
                    <div class="stroke-color-area" id="strokeColorArea" style="opacity:0.4; pointer-events:none;">
                        <div class="color-pickers">
                            <div class="color-picker-group">
                                <label class="color-label" for="strokeStartColor" data-i18n="startColorLabel">起始色</label>
                                <input type="color" id="strokeStartColor" class="color-picker" value="#87292B" />
                                <input type="text" class="color-hex" id="strokeStartColorHex" value="#87292B" />
                            </div>
                            <div class="color-picker-group">
                                <label class="color-label" for="strokeEndColor" data-i18n="endColorLabel">结束色</label>
                                <input type="color" id="strokeEndColor" class="color-picker" value="#F54B4E" />
                                <input type="text" class="color-hex" id="strokeEndColorHex" value="#F54B4E" />
                            </div>
                        </div>
                        <div class="gradient-preview" id="strokeGradientPreview" style="background: linear-gradient(90deg, #87292B, #F54B4E);"></div>
                        <div class="mode-button-group" id="strokeModeGroup">
                            <button class="mode-btn" data-mode="solid" data-i18n="solid">纯色</button>
                            <button class="mode-btn active" data-mode="gradient" data-i18n="gradient">渐变</button>
                            <button class="mode-btn" data-mode="rainbow" data-i18n="rainbow">🌈 彩虹</button>
                        </div>
                        <div class="stroke-params">
                            <div class="stroke-row">
                                <div class="stroke-group">
                                    <label class="stroke-label" for="strokeThickness" data-i18n="thickness">厚度</label>
                                    <input type="range" id="strokeThickness" class="range-input" min="0.5" max="6" step="0.5" value="2" />
                                    <span class="range-value" id="strokeThicknessVal">2</span>
                                </div>
                                <div class="stroke-group">
                                    <label class="stroke-label" for="strokeTransparency" data-i18n="opacity">透明度</label>
                                    <input type="range" id="strokeTransparency" class="range-input" min="0" max="1" step="0.05" value="0" />
                                    <span class="range-value" id="strokeTransparencyVal">0</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- 字体 -->
                <section class="control-section">
                    <label class="section-label" for="fontSelect" data-i18n="fontLabel">字体</label>
                    <select id="fontSelect" class="select-control"></select>
                </section>

                <!-- 样式开关 -->
                <section class="control-section">
                    <label class="section-label" data-i18n="textStyleLabel">文本样式</label>
                    <div class="toggle-group">
                        <label class="toggle-item">
                            <span class="toggle-label" data-i18n="bold">粗体</span>
                            <input type="checkbox" class="toggle-input" id="optBold" />
                            <span class="toggle-track"></span>
                        </label>
                        <label class="toggle-item">
                            <span class="toggle-label" data-i18n="italic">斜体</span>
                            <input type="checkbox" class="toggle-input" id="optItalic" />
                            <span class="toggle-track"></span>
                        </label>
                        <label class="toggle-item">
                            <span class="toggle-label" data-i18n="underline">下划线</span>
                            <input type="checkbox" class="toggle-input" id="optUnderline" />
                            <span class="toggle-track"></span>
                        </label>
                        <label class="toggle-item">
                            <span class="toggle-label" data-i18n="strikethrough">删除线</span>
                            <input type="checkbox" class="toggle-input" id="optStrikethrough" />
                            <span class="toggle-track"></span>
                        </label>
                    </div>
                </section>

            </aside>

            <!-- 右侧预览面板 -->
            <section class="preview-panel">

                <!-- 预览 -->
                <div class="preview-card">
                    <div class="preview-header">
                        <span class="preview-title" data-i18n="previewTitle">预览</span>
                    </div>
                    <div class="preview-container" id="previewContainer">
                        <div class="preview-inner" id="previewInner">
                            <span id="previewRender" style="display:inline-block;">ENDURANCE</span>
                        </div>
                    </div>
                </div>

                <!-- 代码 -->
                <div class="code-card">
                    <div class="code-header">
                        <span class="code-title" data-i18n="codeTitle">生成的 Rich Text 代码</span>
                    </div>
                    <div class="code-wrapper">
                        <pre class="code-block" id="codeBlock"><code id="codeContent">&lt;font color="#87292B"&gt;E&lt;/font&gt;...</code></pre>
                    </div>
                    <div class="code-footer">
                        <span class="code-hint"></span>
                    </div>
                </div>

                <!-- 操作栏（复制/重置） -->
                <div class="action-bar">
                    <button class="btn-primary" id="copyBtn" data-i18n="copyBtn">📋 复制</button>
                    <button class="btn-secondary" id="resetBtn" data-i18n="resetBtn">↺ 重置</button>
                </div>

                <!-- 预设卡片 -->
                <div class="preset-card">
                    <div class="preset-header">
                        <span class="preset-title" data-i18n="presetTitle">预设示例</span>
                        <span class="preset-badge" data-i18n="presetBadge">点击加载</span>
                    </div>
                    <div class="preset-grid">
                        <button class="preset-btn" data-preset="endurance">ENDURANCE</button>
                        <button class="preset-btn" data-preset="celestial">CELESTIAL</button>
                        <button class="preset-btn" data-preset="gliders">20 Gliders</button>
                        <button class="preset-btn" data-preset="vbs">VBS</button>
                    </div>
                </div>

            </section>

        </main>

        <footer class="app-footer">
            <p>Made with <span class="heart">♥</span> · bl1nkCur</p>
        </footer>

    </div>

    <!-- 语言切换脚本 -->
    <script>
        (function() {
            // 翻译字典
            const i18n = {
                zh: {
                    brandTitle: 'Nullscape Lobby Title Generator',
                    brandSub: '为 Nullscaper 生成更好的大厅标题',
                    textLabel: '文本内容',
                    textPlaceholder: '输入要渐变的文本...',
                    textColorLabel: '文本颜色',
                    startColorLabel: '起始色',
                    endColorLabel: '结束色',
                    solid: '纯色',
                    gradient: '渐变',
                    rainbow: '🌈 彩虹',
                    strokeSettings: '描边设置',
                    enable: '启用',
                    thickness: '厚度',
                    opacity: '透明度',
                    fontLabel: '字体',
                    textStyleLabel: '文本样式',
                    bold: '粗体',
                    italic: '斜体',
                    underline: '下划线',
                    strikethrough: '删除线',
                    previewTitle: '预览',
                    codeTitle: '生成的 Rich Text 代码',
                    copyBtn: '📋 复制',
                    resetBtn: '↺ 重置',
                    presetTitle: '预设示例',
                    presetBadge: '点击加载',
                    langLabel: '中文'
                },
                en: {
                    brandTitle: 'Nullscape Lobby Title Generator',
                    brandSub: 'Generate better lobby titles for Nullscaper',
                    textLabel: 'Text',
                    textPlaceholder: 'Enter text to apply gradient...',
                    textColorLabel: 'Text Color',
                    startColorLabel: 'Start Color',
                    endColorLabel: 'End Color',
                    solid: 'Solid',
                    gradient: 'Gradient',
                    rainbow: '🌈 Rainbow',
                    strokeSettings: 'Stroke Settings',
                    enable: 'Enable',
                    thickness: 'Thickness',
                    opacity: 'Opacity',
                    fontLabel: 'Font',
                    textStyleLabel: 'Text Style',
                    bold: 'Bold',
                    italic: 'Italic',
                    underline: 'Underline',
                    strikethrough: 'Strikethrough',
                    previewTitle: 'Preview',
                    codeTitle: 'Generated Rich Text Code',
                    copyBtn: '📋 Copy',
                    resetBtn: '↺ Reset',
                    presetTitle: 'Presets',
                    presetBadge: 'Click to load',
                    langLabel: 'English'
                }
            };

            let currentLang = 'zh';
            const langToggle = document.getElementById('langToggle');
            const langLabel = document.getElementById('langLabel');

            function setLanguage(lang) {
                currentLang = lang;
                const dict = i18n[lang];

                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (dict[key] !== undefined) {
                        el.textContent = dict[key];
                    }
                });

                document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                    const key = el.getAttribute('data-i18n-placeholder');
                    if (dict[key] !== undefined) {
                        el.placeholder = dict[key];
                    }
                });

                if (langLabel) {
                    langLabel.textContent = dict.langLabel || (lang === 'zh' ? '中文' : 'English');
                }

                document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';

                try {
                    localStorage.setItem('preferredLang', lang);
                } catch (e) {}
            }

            function toggleLanguage() {
                const nextLang = currentLang === 'zh' ? 'en' : 'zh';
                // 点击时添加微小的缩放反馈
                if (langToggle) {
                    langToggle.style.transition = 'transform 0.15s cubic-bezier(0.2, 0, 0, 1)';
                    langToggle.style.transform = 'scale(0.92)';
                    setTimeout(() => {
                        langToggle.style.transform = 'scale(1)';
                    }, 150);
                }
                setLanguage(nextLang);
            }

            let savedLang = 'zh';
            try {
                const stored = localStorage.getItem('preferredLang');
                if (stored === 'en' || stored === 'zh') {
                    savedLang = stored;
                }
            } catch (e) {}
            setLanguage(savedLang);

            if (langToggle) {
                langToggle.addEventListener('click', toggleLanguage);
            }
        })();
    </script>

    <script src="script.js"></script>
</body>
</html>
