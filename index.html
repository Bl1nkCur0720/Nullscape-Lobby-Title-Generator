<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nullscape Lobby Title Generator</title>
    <meta name="description" content="为 Nullscape 玩家生成大厅标题（Lobby Title）富文本代码的可视化工具" />
    <meta name="theme-color" content="#07060d" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <!-- 背景：极光 + 星空 -->
    <div class="bg" aria-hidden="true">
        <div class="bg-blob bg-blob-1"></div>
        <div class="bg-blob bg-blob-2"></div>
        <div class="bg-blob bg-blob-3"></div>
        <div class="bg-stars"></div>
    </div>

    <div class="app" id="app">

        <!-- ===== 顶栏 ===== -->
        <header class="app-header">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3l2.1 6.1L20 11l-5.9 1.9L12 19l-2.1-6.1L4 11l5.9-1.9z" fill="currentColor" stroke="none"/>
                        <path d="M19 3.5l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z" fill="currentColor" stroke="none"/>
                        <path d="M5 15l.5 1.5L7 17l-1.5.5L5 19l-.5-1.5L3 17l1.5-.5z" fill="currentColor" stroke="none"/>
                    </svg>
                </span>
                <span class="brand-text">
                    <span class="brand-title">Nullscape <span class="brand-title-accent">Lobby Title</span></span>
                    <span class="brand-sub" data-i18n="brandSub">为 Nullscaper 生成更好的大厅标题</span>
                </span>
            </div>
            <div class="header-actions">
                <a class="icon-btn" id="githubLink" href="https://github.com/Bl1nkCur0720/Nullscape-Lobby-Title-Generator"
                    target="_blank" rel="noopener" data-i18n-title="githubLinkTitle" aria-label="GitHub">
                    <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
                        <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.55 0-.27-.01-1.17-.02-2.12-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.75 2.69 1.25 3.34.95.1-.74.4-1.25.72-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 5.78 0c2.21-1.49 3.18-1.18 3.18-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.69 5.38-5.25 5.67.41.35.77 1.05.77 2.12 0 1.53-.01 2.76-.01 3.14 0 .3.2.66.8.55A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/>
                    </svg>
                </a>
                <div class="lang-switch" id="langSwitch" role="group" data-i18n-title="langTitle" aria-label="Language">
                    <span class="lang-thumb" id="langThumb" aria-hidden="true"></span>
                    <button type="button" class="lang-opt active" data-lang="zh">中文</button>
                    <button type="button" class="lang-opt" data-lang="en">EN</button>
                </div>
            </div>
        </header>

        <!-- ===== 工作区 ===== -->
        <main class="workspace">

            <!-- 左侧：控制面板 -->
            <aside class="controls" aria-label="Settings">
                <div class="controls-scroll" id="controlsScroll">

                    <!-- 文本颜色 -->
                    <section class="panel" id="panelColor" style="--i:1">
                        <div class="panel-head">
                            <button type="button" class="panel-toggle" aria-expanded="true" aria-controls="colorBody">
                                <span class="panel-icon" aria-hidden="true">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M12 21a9 9 0 1 1 9-9c0 1.7-1.3 3-3 3h-2.2a2.6 2.6 0 0 0-2.1 4.2c.3.5.3 1.1 0 1.4-.2.3-.6.4-1.1.4z"/>
                                        <circle cx="7.5" cy="10.5" r="1" fill="currentColor" stroke="none"/>
                                        <circle cx="12" cy="7.5" r="1" fill="currentColor" stroke="none"/>
                                        <circle cx="16.5" cy="10.5" r="1" fill="currentColor" stroke="none"/>
                                    </svg>
                                </span>
                                <span class="panel-title" data-i18n="textColorLabel">文本颜色</span>
                                <span class="panel-summary" id="colorSummary"></span>
                                <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="6 9 12 15 18 9"/>
                                </svg>
                            </button>
                        </div>
                        <div class="panel-body" id="colorBody">
                            <div class="panel-body-inner">
                                <div class="mode-seg" id="textModeGroup" role="radiogroup">
                                    <span class="mode-thumb" aria-hidden="true"></span>
                                    <button type="button" class="mode-btn active" data-mode="solid" role="radio" aria-checked="true" data-i18n="solid">纯色</button>
                                    <button type="button" class="mode-btn" data-mode="gradient" role="radio" aria-checked="false" data-i18n="gradient">渐变</button>
                                    <button type="button" class="mode-btn" data-mode="three" role="radio" aria-checked="false" data-i18n="three">三色</button>
                                    <button type="button" class="mode-btn" data-mode="rainbow" role="radio" aria-checked="false" data-i18n="rainbow">彩虹</button>
                                    <button type="button" class="mode-btn" data-mode="edge" role="radio" aria-checked="false" data-i18n="edge">两边→中</button>
                                </div>

                                <div class="color-fields" id="textColors">
                                    <div class="color-field" id="textStartColorGroup">
                                        <label class="field-label" id="textStartColorLabel" for="textStartColor" data-i18n="startColorLabel">起始色</label>
                                        <div class="field-row">
                                            <label class="swatch" data-for="textStartColor">
                                                <input type="color" id="textStartColor" value="#87292B" />
                                                <span class="swatch-cover" aria-hidden="true"></span>
                                            </label>
                                            <input type="text" class="hex-input" id="textStartColorHex" value="#87292B" maxlength="7" spellcheck="false" autocomplete="off" />
                                        </div>
                                    </div>
                                    <div class="color-field" id="textMidColorGroup" hidden>
                                        <label class="field-label" id="textMidColorLabel" for="textMidColor" data-i18n="midColorLabel">中间色</label>
                                        <div class="field-row">
                                            <label class="swatch" data-for="textMidColor">
                                                <input type="color" id="textMidColor" value="#B03A40" />
                                                <span class="swatch-cover" aria-hidden="true"></span>
                                            </label>
                                            <input type="text" class="hex-input" id="textMidColorHex" value="#B03A40" maxlength="7" spellcheck="false" autocomplete="off" />
                                        </div>
                                    </div>
                                    <div class="color-field" id="textEndColorGroup">
                                        <label class="field-label" id="textEndColorLabel" for="textEndColor" data-i18n="endColorLabel">结束色</label>
                                        <div class="field-row">
                                            <label class="swatch" data-for="textEndColor">
                                                <input type="color" id="textEndColor" value="#F54B4E" />
                                                <span class="swatch-cover" aria-hidden="true"></span>
                                            </label>
                                            <input type="text" class="hex-input" id="textEndColorHex" value="#F54B4E" maxlength="7" spellcheck="false" autocomplete="off" />
                                        </div>
                                    </div>
                                </div>

                                <p class="rainbow-note" id="textRainbowNote" hidden data-i18n="rainbowNote">彩虹模式：颜色按色相自动生成</p>
                                <div class="gradient-preview" id="textGradientPreview"></div>
                                <div class="swatch-row" data-section="text">
                                    <span class="swatch-label" data-i18n="quickColors">快速取色</span>
                                    <div class="swatch-list" id="textSwatches"></div>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- 描边 -->
                    <section class="panel" id="panelStroke" style="--i:2">
                        <div class="panel-head">
                            <button type="button" class="panel-toggle" aria-expanded="true" aria-controls="strokeBody">
                                <span class="panel-icon" aria-hidden="true">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M12 20h9"/>
                                        <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>
                                    </svg>
                                </span>
                                <span class="panel-title" data-i18n="strokeSettings">描边</span>
                                <span class="panel-summary" id="strokeSummary"></span>
                                <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="6 9 12 15 18 9"/>
                                </svg>
                            </button>
                            <label class="switch" title="" id="strokeSwitchLabel">
                                <input type="checkbox" id="optStroke" />
                                <span class="switch-track"><span class="switch-knob"></span></span>
                            </label>
                        </div>
                        <div class="panel-body" id="strokeBody">
                            <div class="panel-body-inner">
                                <div class="mode-seg" id="strokeModeGroup" role="radiogroup">
                                    <span class="mode-thumb" aria-hidden="true"></span>
                                    <button type="button" class="mode-btn active" data-mode="solid" role="radio" aria-checked="true" data-i18n="solid">纯色</button>
                                    <button type="button" class="mode-btn" data-mode="gradient" role="radio" aria-checked="false" data-i18n="gradient">渐变</button>
                                    <button type="button" class="mode-btn" data-mode="three" role="radio" aria-checked="false" data-i18n="three">三色</button>
                                    <button type="button" class="mode-btn" data-mode="rainbow" role="radio" aria-checked="false" data-i18n="rainbow">彩虹</button>
                                    <button type="button" class="mode-btn" data-mode="edge" role="radio" aria-checked="false" data-i18n="edge">两边→中</button>
                                </div>

                                <div class="color-fields" id="strokeColors">
                                    <div class="color-field" id="strokeStartColorGroup">
                                        <label class="field-label" id="strokeStartColorLabel" for="strokeStartColor" data-i18n="startColorLabel">起始色</label>
                                        <div class="field-row">
                                            <label class="swatch" data-for="strokeStartColor">
                                                <input type="color" id="strokeStartColor" value="#87292B" />
                                                <span class="swatch-cover" aria-hidden="true"></span>
                                            </label>
                                            <input type="text" class="hex-input" id="strokeStartColorHex" value="#87292B" maxlength="7" spellcheck="false" autocomplete="off" />
                                        </div>
                                    </div>
                                    <div class="color-field" id="strokeMidColorGroup" hidden>
                                        <label class="field-label" id="strokeMidColorLabel" for="strokeMidColor" data-i18n="midColorLabel">中间色</label>
                                        <div class="field-row">
                                            <label class="swatch" data-for="strokeMidColor">
                                                <input type="color" id="strokeMidColor" value="#B03A40" />
                                                <span class="swatch-cover" aria-hidden="true"></span>
                                            </label>
                                            <input type="text" class="hex-input" id="strokeMidColorHex" value="#B03A40" maxlength="7" spellcheck="false" autocomplete="off" />
                                        </div>
                                    </div>
                                    <div class="color-field" id="strokeEndColorGroup">
                                        <label class="field-label" id="strokeEndColorLabel" for="strokeEndColor" data-i18n="endColorLabel">结束色</label>
                                        <div class="field-row">
                                            <label class="swatch" data-for="strokeEndColor">
                                                <input type="color" id="strokeEndColor" value="#F54B4E" />
                                                <span class="swatch-cover" aria-hidden="true"></span>
                                            </label>
                                            <input type="text" class="hex-input" id="strokeEndColorHex" value="#F54B4E" maxlength="7" spellcheck="false" autocomplete="off" />
                                        </div>
                                    </div>
                                </div>

                                <p class="rainbow-note" id="strokeRainbowNote" hidden data-i18n="rainbowNote">彩虹模式：颜色按色相自动生成</p>
                                <div class="gradient-preview" id="strokeGradientPreview"></div>
                                <div class="swatch-row" data-section="stroke">
                                    <span class="swatch-label" data-i18n="quickColors">快速取色</span>
                                    <div class="swatch-list" id="strokeSwatches"></div>
                                </div>
                                <div class="slider-row">
                                    <div class="slider-field">
                                        <div class="slider-head">
                                            <label for="strokeThickness" data-i18n="thickness">厚度</label>
                                            <span class="slider-val" id="strokeThicknessVal">2</span>
                                        </div>
                                        <input type="range" id="strokeThickness" min="0.5" max="6" step="0.5" value="2" />
                                    </div>
                                    <div class="slider-field">
                                        <div class="slider-head">
                                            <label for="strokeTransparency" data-i18n="opacity">透明度</label>
                                            <span class="slider-val" id="strokeTransparencyVal">0</span>
                                        </div>
                                        <input type="range" id="strokeTransparency" min="0" max="1" step="0.05" value="0" />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- 字体与样式 -->
                    <section class="panel" id="panelFont" style="--i:3">
                        <div class="panel-head">
                            <button type="button" class="panel-toggle" aria-expanded="true" aria-controls="fontBody">
                                <span class="panel-icon" aria-hidden="true">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="4 7 4 4 20 4 20 7"/>
                                        <line x1="9" y1="20" x2="15" y2="20"/>
                                        <line x1="12" y1="4" x2="12" y2="20"/>
                                    </svg>
                                </span>
                                <span class="panel-title" data-i18n="fontLabel">字体与样式</span>
                                <span class="panel-summary" id="fontSummary"></span>
                                <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="6 9 12 15 18 9"/>
                                </svg>
                            </button>
                        </div>
                        <div class="panel-body" id="fontBody">
                            <div class="panel-body-inner">
                                <div class="font-picker" id="fontPicker">
                                    <button type="button" class="font-picker-btn" id="fontPickerBtn" aria-haspopup="listbox" aria-expanded="false">
                                        <span class="font-sample" id="fontCurrentSample" aria-hidden="true">Aa</span>
                                        <span class="font-name" id="fontCurrentName">Builder Sans</span>
                                        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <polyline points="6 9 12 15 18 9"/>
                                        </svg>
                                    </button>
                                    <div class="font-dropdown" id="fontDropdown" hidden>
                                        <div class="font-search">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                                <circle cx="11" cy="11" r="7"/>
                                                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                                            </svg>
                                            <input type="text" id="fontSearch" data-i18n-placeholder="fontSearchPlaceholder" placeholder="搜索字体…" autocomplete="off" spellcheck="false" />
                                            <kbd>Esc</kbd>
                                        </div>
                                        <div class="font-list" id="fontList" role="listbox" aria-label="Fonts"></div>
                                    </div>
                                </div>

                                <div class="style-toggles" id="styleToggles">
                                    <button type="button" class="chip" data-style="bold" aria-pressed="false" data-i18n-title="bold">
                                        <span class="chip-glyph" style="font-weight:800">B</span>
                                        <span class="chip-label" data-i18n="bold">粗体</span>
                                    </button>
                                    <button type="button" class="chip" data-style="italic" aria-pressed="false" data-i18n-title="italic">
                                        <span class="chip-glyph" style="font-style:italic;font-family:Georgia,serif">I</span>
                                        <span class="chip-label" data-i18n="italic">斜体</span>
                                    </button>
                                    <button type="button" class="chip" data-style="underline" aria-pressed="false" data-i18n-title="underline">
                                        <span class="chip-glyph" style="text-decoration:underline">U</span>
                                        <span class="chip-label" data-i18n="underline">下划线</span>
                                    </button>
                                    <button type="button" class="chip" data-style="strike" aria-pressed="false" data-i18n-title="strikethrough">
                                        <span class="chip-glyph" style="text-decoration:line-through">S</span>
                                        <span class="chip-label" data-i18n="strikethrough">删除线</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </section>

                </div>
            </aside>

            <!-- 右侧：结果区 -->
            <section class="stage">
                <div class="stage-scroll" id="stageScroll">

                    <!-- 标题文本 -->
                    <section class="panel" style="--i:0">
                        <div class="panel-head head-static">
                            <span class="panel-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/>
                                </svg>
                            </span>
                            <span class="panel-title" data-i18n="textLabel">标题文本</span>
                            <span class="char-count" id="charCount">9/50</span>
                        </div>
                        <div class="panel-body">
                            <div class="panel-body-inner">
                                <div class="input-wrap">
                                    <input type="text" id="textInput" class="title-input" value="ENDURANCE" maxlength="50"
                                        data-i18n-placeholder="textPlaceholder" placeholder="输入标题，用 || 分隔分段…" autocomplete="off" spellcheck="false" />
                                    <button type="button" class="input-clear" id="inputClear" data-i18n-title="clearText" aria-label="Clear" hidden>
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <line x1="18" y1="6" x2="6" y2="18"/>
                                            <line x1="6" y1="6" x2="18" y2="18"/>
                                        </svg>
                                    </button>
                                </div>
                                <div class="segments" id="segmentChips"></div>
                                <p class="hint" data-i18n="textHint">使用 || 分隔多个分段，每个分段可单独设置样式</p>
                            </div>
                        </div>
                    </section>

                    <!-- 预览（桌面端吸顶） -->
                    <section class="preview-card" id="previewCard" style="--i:4">
                        <div class="preview-stage" id="previewContainer">
                            <div class="preview-vignette" aria-hidden="true"></div>
                            <div class="preview-inner" id="previewInner">
                                <span id="previewRender">ENDURANCE</span>
                            </div>
                            <span class="preview-tag" data-i18n="previewTitle">预览</span>
                        </div>
                    </section>

                    <!-- 操作栏 -->
                    <div class="action-row" style="--i:5">
                        <button type="button" class="btn btn-primary" id="copyBtn">
                            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="9" y="9" width="13" height="13" rx="2"/>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                            </svg>
                            <span data-i18n="copyBtn">复制代码</span>
                        </button>
                        <button type="button" class="btn btn-ghost" id="resetBtn">
                            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="1 4 1 10 7 10"/>
                                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
                            </svg>
                            <span data-i18n="resetBtn">重置</span>
                        </button>
                        <span class="action-gap"></span>
                        <button type="button" class="icon-btn" id="undoBtn" data-i18n-title="undoTitle" aria-label="Undo">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="9 14 4 9 9 4"/>
                                <path d="M20 20v-7a4 4 0 0 0-4-4H4"/>
                            </svg>
                        </button>
                        <button type="button" class="icon-btn" id="redoBtn" data-i18n-title="redoTitle" aria-label="Redo">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="15 14 20 9 15 4"/>
                                <path d="M4 20v-7a4 4 0 0 1 4-4h12"/>
                            </svg>
                        </button>
                        <button type="button" class="icon-btn" id="randomBtn" data-i18n-title="randomTitle" aria-label="Random">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="16 3 21 3 21 8"/>
                                <line x1="4" y1="20" x2="21" y2="3"/>
                                <polyline points="21 16 21 21 16 21"/>
                                <line x1="15" y1="15" x2="21" y2="21"/>
                                <line x1="4" y1="4" x2="9" y2="9"/>
                            </svg>
                        </button>
                    </div>

                    <!-- 代码 -->
                    <section class="panel" style="--i:6">
                        <div class="panel-head head-static">
                            <span class="panel-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="16 18 22 12 16 6"/>
                                    <polyline points="8 6 2 12 8 18"/>
                                </svg>
                            </span>
                            <span class="panel-title" data-i18n="codeTitle">Rich Text 代码</span>
                            <span class="code-len" id="codeLen" data-i18n-title="codeLenTitle">0</span>
                            <button type="button" class="mini-btn" id="codeCopyBtn" data-i18n-title="copyBtn" aria-label="Copy code">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="9" y="9" width="13" height="13" rx="2"/>
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                                </svg>
                            </button>
                        </div>
                        <div class="panel-body">
                            <div class="panel-body-inner">
                                <pre class="code-block" id="codeBlock"><code id="codeContent"></code></pre>
                            </div>
                        </div>
                    </section>

                    <!-- 预设 -->
                    <section class="panel" style="--i:7">
                        <div class="panel-head head-static">
