<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nullscape · 标题生成器</title>

    <!-- ===== 外部样式 ===== -->
    <link rel="stylesheet" href="style.css" />

    <style>
        /* ============================================
               全新设计 — 极简 · 精致 · 聚焦
               ============================================ */

        /* ---- 重置增强 ---- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--md-sys-color-background);
            color: var(--md-sys-color-on-background);
            font-family: 'Inter', 'Roboto', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ---- 主容器：毛玻璃质感 ---- */
        .app {
            max-width: 1320px;
            width: 100%;
            background: var(--md-sys-color-surface-container);
            border-radius: var(--md-sys-shape-corner-extra-large);
            box-shadow: var(--md-sys-elevation-3);
            overflow: hidden;
            backdrop-filter: blur(2px);
            transition: background 0.3s;
        }

        /* ---- 顶栏：简洁品牌 ---- */
        .app-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px 20px;
            padding: 18px 32px;
            background: var(--md-sys-color-surface-container-high);
            border-bottom: 1px solid var(--md-sys-color-outline-variant);
        }

        .app-bar .brand {
            display: flex;
            align-items: baseline;
            gap: 6px;
            flex-wrap: wrap;
        }

        .app-bar .brand h1 {
            font-size: 1.5rem;
            font-weight: 550;
            letter-spacing: -0.02em;
            color: var(--md-sys-color-on-surface);
            margin: 0;
        }

        .app-bar .brand h1 span {
            font-weight: 350;
            color: var(--md-sys-color-on-surface-variant);
        }

        .app-bar .brand .tag {
            font-size: 0.75rem;
            color: var(--md-sys-color-on-surface-variant);
            background: var(--md-sys-color-surface-container-lowest);
            padding: 2px 12px;
            border-radius: var(--md-sys-shape-corner-full);
            border: 1px solid var(--md-sys-color-outline-variant);
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        .app-bar .actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* ---- 语言切换 & 主题切换 ---- */
        .lang-switch {
            display: flex;
            background: var(--md-sys-color-surface-container-lowest);
            border-radius: var(--md-sys-shape-corner-full);
            padding: 2px;
            border: 1px solid var(--md-sys-color-outline-variant);
        }

        .lang-switch button {
            background: transparent;
            border: none;
            padding: 4px 16px;
            border-radius: var(--md-sys-shape-corner-full);
            cursor: pointer;
            color: var(--md-sys-color-on-surface-variant);
            font-weight: 500;
            font-size: 0.75rem;
            transition: 0.2s;
            font-family: inherit;
        }

        .lang-switch button.active {
            background: var(--md-sys-color-surface-container);
            color: var(--md-sys-color-on-surface);
            box-shadow: var(--md-sys-elevation-1);
        }

        .lang-switch button:hover:not(.active) {
            color: var(--md-sys-color-on-surface);
        }

        .theme-toggle {
            background: var(--md-sys-color-surface-container-lowest);
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: var(--md-sys-shape-corner-full);
            padding: 4px 10px;
            cursor: pointer;
            font-size: 1.1rem;
            line-height: 1.4;
            transition: 0.2s;
            color: var(--md-sys-color-on-surface);
            font-family: inherit;
        }

        .theme-toggle:hover {
            background: var(--md-sys-color-surface-container-highest);
        }

        /* ---- 主体：双栏优雅间距 ---- */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
            padding: 28px 32px 32px;
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
                gap: 24px;
                padding: 20px;
            }
            .app-bar {
                padding: 14px 20px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            .main-grid {
                padding: 12px;
                gap: 16px;
            }
            .app-bar .brand h1 {
                font-size: 1.2rem;
            }
            .app-bar .brand .tag {
                font-size: 0.6rem;
                padding: 0 8px;
            }
        }

        /* ---- 卡片：柔和轻盈 ---- */
        .panel {
            background: var(--md-sys-color-surface-container-low);
            border-radius: var(--md-sys-shape-corner-large);
            padding: 24px 24px 28px;
            box-shadow: var(--md-sys-elevation-1);
            transition: box-shadow 0.25s, transform 0.2s;
        }

        .panel:hover {
            box-shadow: var(--md-sys-elevation-2);
        }

        .panel-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--md-sys-color-outline-variant);
        }

        .panel-head .icon {
            font-size: 1.2rem;
            line-height: 1;
            opacity: 0.8;
        }

        .panel-head h2 {
            font-size: 0.95rem;
            font-weight: 550;
            color: var(--md-sys-color-on-surface);
            margin: 0;
            letter-spacing: 0.01em;
        }

        .panel-head .pill {
            margin-left: auto;
            background: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            font-size: 0.55rem;
            font-weight: 600;
            padding: 2px 14px;
            border-radius: var(--md-sys-shape-corner-full);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        /* ---- 表单控件精致化 ---- */
        .field {
            margin-bottom: 18px;
        }
        .field:last-child {
            margin-bottom: 0;
        }

        .field .label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--md-sys-color-on-surface-variant);
            margin-bottom: 4px;
        }

        .field .label .label-hint {
            font-weight: 400;
            text-transform: none;
            opacity: 0.6;
            font-size: 0.65rem;
        }

        .field .hint {
            font-size: 0.65rem;
            color: var(--md-sys-color-on-surface-variant);
            margin-top: 4px;
            opacity: 0.75;
        }

        .field .hint code {
            background: var(--md-sys-color-surface-container-highest);
            padding: 0 6px;
            border-radius: 4px;
            font-family: 'SF Mono', monospace;
            font-size: 0.6rem;
            color: var(--md-sys-color-on-surface);
        }

        /* ---- 输入框覆盖 ---- */
        .md-text-field .md-text-field-input {
            min-height: 42px;
            padding: 8px 14px;
            font-size: 0.9rem;
            border-radius: var(--md-sys-shape-corner-medium);
        }

        textarea.md-text-field-input {
            min-height: 60px;
            resize: vertical;
            font-family: 'SF Mono', 'Menlo', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .md-select select {
            min-height: 42px;
            padding: 8px 36px 8px 14px;
            font-size: 0.85rem;
            border-radius: var(--md-sys-shape-corner-medium);
        }

        /* ---- 预设网格 ---- */
        .preset-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 6px;
            margin-top: 2px;
        }

        .preset-btn {
            padding: 5px 0 7px;
            border-radius: var(--md-sys-shape-corner-medium);
            border: 1px solid var(--md-sys-color-outline-variant);
            background: var(--md-sys-color-surface-container-lowest);
            color: var(--md-sys-color-on-surface);
            font-weight: 500;
            font-size: 0.6rem;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
            font-family: inherit;
            line-height: 1.3;
        }

        .preset-btn:hover {
            background: var(--md-sys-color-surface-container-highest);
            border-color: var(--md-sys-color-primary);
            transform: translateY(-1px);
            box-shadow: var(--md-sys-elevation-1);
        }

        .preset-btn .swatch {
            display: flex;
            height: 4px;
            border-radius: 4px;
            margin: 5px auto 2px;
            width: 65%;
        }

        /* ---- 分段颜色 ---- */
        .segment-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 2px;
        }

        .segment-item {
            background: var(--md-sys-color-surface-container-lowest);
            border-radius: var(--md-sys-shape-corner-medium);
            padding: 12px 14px;
            border: 1px solid var(--md-sys-color-outline-variant);
            transition: border-color 0.2s;
        }

        .segment-item:hover {
            border-color: var(--md-sys-color-outline);
        }

        .segment-item .seg-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .segment-item .seg-label {
            font-weight: 500;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .segment-item .seg-text {
            color: var(--md-sys-color-on-surface);
            font-size: 0.75rem;
            font-family: 'SF Mono', monospace;
            background: var(--md-sys-color-surface-container-highest);
            padding: 0 10px;
            border-radius: var(--md-sys-shape-corner-full);
            max-width: 55%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .segment-item .seg-colors {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .segment-item .color-picker-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            min-width: 100px;
        }

        .segment-item .color-picker-wrap input[type="color"] {
            width: 28px;
            height: 28px;
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: var(--md-sys-shape-corner-small);
            cursor: pointer;
            padding: 2px;
            background: var(--md-sys-color-surface-container-lowest);
            flex-shrink: 0;
        }

        .segment-item .color-picker-wrap input[type="text"] {
            flex: 1;
            min-width: 44px;
            padding: 2px 6px;
            font-size: 0.65rem;
            font-family: 'SF Mono', monospace;
            background: var(--md-sys-color-surface-container-lowest);
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: var(--md-sys-shape-corner-small);
            color: var(--md-sys-color-on-surface);
            transition: border-color 0.2s;
        }

        .segment-item .color-picker-wrap input[type="text"]:focus {
            border-color: var(--md-sys-color-primary);
            outline: none;
        }

        /* ---- 模式切换 ---- */
        .mode-group {
            display: inline-flex;
            gap: 3px;
            background: var(--md-sys-color-surface-container-highest);
            padding: 2px;
            border-radius: var(--md-sys-shape-corner-full);
            border: 1px solid var(--md-sys-color-outline-variant);
            flex-shrink: 0;
        }

        .mode-btn {
            padding: 2px 14px;
            border: none;
            border-radius: var(--md-sys-shape-corner-full);
            background: transparent;
            color: var(--md-sys-color-on-surface-variant);
            font-weight: 500;
            font-size: 0.65rem;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            font-family: inherit;
        }

        .mode-btn.active {
            background: var(--md-sys-color-surface-container-lowest);
            color: var(--md-sys-color-on-surface);
            box-shadow: var(--md-sys-elevation-1);
        }

        .mode-btn:hover:not(.active) {
            color: var(--md-sys-color-on-surface);
        }

        /* ---- Toggle 开关 ---- */
        .toggle-group {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 8px;
            align-items: center;
        }

        .toggle-item {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 2px 10px 2px 6px;
            background: var(--md-sys-color-surface-container-lowest);
            border-radius: var(--md-sys-shape-corner-full);
            border: 1px solid var(--md-sys-color-outline-variant);
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
            font-size: 0.75rem;
            line-height: 1.2;
            font-family: inherit;
        }

        .toggle-item:hover {
            border-color: var(--md-sys-color-outline);
        }

        .toggle-item.active {
            border-color: var(--md-sys-color-primary);
            background: var(--md-sys-color-primary-container);
        }

        .toggle-item input[type="checkbox"] {
            display: none;
        }

        .toggle-item .track {
            width: 26px;
            height: 14px;
            background: var(--md-sys-color-outline-variant);
            border-radius: var(--md-sys-shape-corner-full);
            position: relative;
            transition: 0.25s;
            flex-shrink: 0;
        }

        .toggle-item .track::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            background: var(--md-sys-color-surface-container-lowest);
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: 0.25s;
            box-shadow: var(--md-sys-elevation-1);
        }

        .toggle-item.active .track {
            background: var(--md-sys-color-primary);
        }

        .toggle-item.active .track::after {
            transform: translateX(12px);
        }

        .toggle-item .label-text {
            font-weight: 450;
            color: var(--md-sys-color-on-surface);
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }

        /* ---- 描边控制行 ---- */
        .stroke-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 12px;
        }

        .stroke-row .toggle-item {
            flex-shrink: 0;
        }

        .stroke-row .mode-group {
            flex-shrink: 0;
        }

        .stroke-row .range-wrap {
            flex: 1;
            min-width: 110px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .range-wrap input[type="range"] {
            flex: 1;
            height: 3px;
            -webkit-appearance: none;
            background: var(--md-sys-color-outline-variant);
            border-radius: 6px;
            outline: none;
        }

        .range-wrap input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--md-sys-color-primary);
            cursor: pointer;
            border: 2px solid var(--md-sys-color-surface-container-lowest);
            box-shadow: var(--md-sys-elevation-1);
        }

        .range-wrap input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--md-sys-color-primary);
            cursor: pointer;
            border: 2px solid var(--md-sys-color-surface-container-lowest);
            box-shadow: var(--md-sys-elevation-1);
        }

        .range-wrap .range-val {
            min-width: 24px;
            text-align: right;
            font-weight: 500;
            color: var(--md-sys-color-on-surface);
            font-size: 0.75rem;
        }

        .range-wrap .range-label {
            font-size: 0.65rem;
            color: var(--md-sys-color-on-surface-variant);
            flex-shrink: 0;
        }

        /* ---- 描边颜色集 ---- */
        .stroke-colors {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-top: 6px;
            padding: 8px 12px;
            background: var(--md-sys-color-surface-container-lowest);
            border-radius: var(--md-sys-shape-corner-medium);
            border: 1px solid var(--md-sys-color-outline-variant);
        }

        .stroke-colors .color-picker-wrap {
            display: flex;
            align-items: center;
            gap: 5px;
            flex: 1;
            min-width: 90px;
        }

        .stroke-colors .color-picker-wrap input[type="color"] {
            width: 26px;
            height: 26px;
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: var(--md-sys-shape-corner-small);
            cursor: pointer;
            padding: 2px;
            background: var(--md-sys-color-surface-container-lowest);
            flex-shrink: 0;
        }

        .stroke-colors .color-picker-wrap input[type="text"] {
            flex: 1;
            min-width: 44px;
            padding: 1px 6px;
            font-size: 0.6rem;
            font-family: 'SF Mono', monospace;
            background: var(--md-sys-color-surface-container-lowest);
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: var(--md-sys-shape-corner-small);
            color: var(--md-sys-color-on-surface);
        }

        .stroke-colors .color-picker-wrap input[type="text"]:focus {
            border-color: var(--md-sys-color-primary);
            outline: none;
        }

        .stroke-colors .label-sm {
            font-size: 0.6rem;
            color: var(--md-sys-color-on-surface-variant);
            min-width: 20px;
            font-weight: 500;
        }

        /* ---- 描边预设 ---- */
        .preset-grid-stroke {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
            gap: 5px;
            margin-top: 2px;
        }

        .preset-btn-stroke {
            padding: 3px 0 5px;
            border-radius: var(--md-sys-shape-corner-medium);
            border: 1px solid var(--md-sys-color-outline-variant);
            background: var(--md-sys-color-surface-container-lowest);
            color: var(--md-sys-color-on-surface);
            font-weight: 500;
            font-size: 0.5rem;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
            font-family: inherit;
            line-height: 1.3;
        }

        .preset-btn-stroke:hover {
            background: var(--md-sys-color-surface-container-highest);
            border-color: var(--md-sys-color-primary);
        }

        .preset-btn-stroke .swatch-sm {
            display: flex;
            height: 3px;
            border-radius: 3px;
            margin: 4px auto 2px;
            width: 60%;
        }

        /* ---- 按钮组 ---- */
        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        .btn-group .md-btn {
            flex: 0 1 auto;
            font-size: 0.8rem;
            padding: 8px 18px;
            min-height: 36px;
        }

        .btn-group .md-btn:last-child {
            margin-left: auto;
        }

        @media (max-width: 480px) {
            .btn-group .md-btn:last-child {
                margin-left: 0;
            }
            .btn-group {
                flex-direction: column;
            }
            .btn-group .md-btn {
                width: 100%;
                justify-content: center;
            }
        }

        /* ---- 预览 ---- */
        .preview-box {
            background: var(--md-sys-color-surface-container-lowest);
            border-radius: var(--md-sys-shape-corner-large);
            padding: 28px 20px;
            min-height: 96px;
            border: 1px solid var(--md-sys-color-outline-variant);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: 0.2s;
            margin-bottom: 16px;
            position: relative;
        }

        .preview-box::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background: radial-gradient(circle at 50% 0%, var(--md-sys-color-primary-container), transparent 70%);
            opacity: 0.08;
        }

        .preview-text {
            font-size: 2rem;
            line-height: 1.4;
            font-weight: 600;
            letter-spacing: -0.01em;
            word-break: break-word;
            color: var(--md-sys-color-on-surface);
            position: relative;
            z-index: 1;
        }

        @media (max-width: 480px) {
            .preview-text {
                font-size: 1.4rem;
            }
        }

        /* ---- 输出代码 ---- */
        .output-box {
            background: var(--md-sys-color-surface-container-lowest);
            padding: 12px 16px;
            border-radius: var(--md-sys-shape-corner-medium);
            font-family: 'SF Mono', 'Menlo', 'Courier New', monospace;
            font-size: 0.65rem;
            color: var(--md-sys-color-on-surface);
            min-height: 72px;
            max-height: 160px;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.7;
            border: 1px solid var(--md-sys-color-outline-variant);
        }

        /* ---- 底部脚注 ---- */
        .footnote {
            margin-top: 16px;
            padding: 12px 16px;
            background: var(--md-sys-color-surface-container-lowest);
            border-radius: var(--md-sys-shape-corner-medium);
            font-size: 0.7rem;
            color: var(--md-sys-color-on-surface-variant);
            border-left: 3px solid var(--md-sys-color-primary);
            line-height: 1.6;
        }

        .footnote code {
            background: var(--md-sys-color-surface-container-highest);
            padding: 0 6px;
            border-radius: 4px;
            font-family: 'SF Mono', monospace;
            font-size: 0.65rem;
            color: var(--md-sys-color-on-surface);
        }

        /* ---- Toast ---- */
        .toast-msg {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--md-sys-color-surface-container);
            color: var(--md-sys-color-on-surface);
            padding: 10px 26px;
            border-radius: var(--md-sys-shape-corner-full);
            box-shadow: var(--md-sys-elevation-4);
            z-index: 9999;
            font-weight: 500;
            font-size: 0.8rem;
            transition: opacity 0.3s;
            border: 1px solid var(--md-sys-color-outline-variant);
            backdrop-filter: blur(8px);
        }

        /* ---- 分割线 ---- */
        .divider {
            border: 0;
            border-top: 1px solid var(--md-sys-color-outline-variant);
            margin: 14px 0;
        }

        /* ---- 响应式微调 ---- */
        @media (max-width: 600px) {
            .stroke-row {
                flex-direction: column;
                align-items: stretch;
            }
            .stroke-row .range-wrap {
                min-width: unset;
            }
            .stroke-colors {
                flex-direction: column;
                align-items: stretch;
            }
            .segment-item .seg-colors {
                flex-direction: column;
            }
            .segment-item .color-picker-wrap {
                min-width: unset;
            }
            .panel {
                padding: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="app">

        <!-- ==========================================
        顶栏
        ========================================== -->
        <header class="app-bar">
            <div class="brand">
                <h1>Nullscape <span>Lobby Title</span></h1>
                <span class="tag">生成器</span>
            </div>
            <div class="actions">
                <div class="lang-switch" id="langToggle">
                    <button class="active" data-lang="zh">中文</button>
                    <button data-lang="en">English</button>
                </div>
                <button id="themeToggle" class="theme-toggle" aria-label="切换深色模式">🌙</button>
            </div>
        </header>

        <!-- ==========================================
        主体
        ========================================== -->
        <div class="main-grid">

            <!-- ===== 左栏：控制面板 ===== -->
            <div class="panel">
                <div class="panel-head">
                    <span class="icon">⚙️</span>
                    <h2 data-i18n="settings">设置</h2>
                    <span class="pill">RichText</span>
                </div>

                <!-- 标题文本 -->
                <div class="field">
                    <div class="label" data-i18n="titleText">📝 标题文本</div>
                    <div class="md-text-field md-text-field-filled">
                        <textarea class="md-text-field-input" id="inputText" rows="2">ENDURANCE</textarea>
                    </div>
                </div>

                <!-- 字体 -->
                <div class="field">
                    <div class="label" data-i18n="fontSelect">🔤 字体</div>
                    <div class="md-select">
                        <select id="fontSelect">
                            <option value="">默认 (无)</option>
                        </select>
                        <span class="md-select-arrow">▾</span>
                    </div>
                    <div class="hint" data-i18n="fontHint">选择后自动添加 <code>family="rbxasset://fonts/families/字体名(无空格).json"</code></div>
                </div>

                <!-- 预设 -->
                <div class="field">
                    <div class="label" data-i18n="presets">🎨 预设</div>
                    <div class="preset-grid" id="textPresetGrid">
                        <button class="preset-btn" data-preset="endurance"><span>ENDURANCE</span><span class="swatch" style="background:linear-gradient(to right,#87292B,#F54B4E);"></span></button>
                        <button class="preset-btn" data-preset="celestial"><span>CELESTIAL</span><span class="swatch" style="background:linear-gradient(to right,#9E3862,#F25597);"></span></button>
                        <button class="preset-btn" data-preset="voidbound"><span>VOIDBOUND</span><span class="swatch" style="background:linear-gradient(to right,#8481A6,#CBC6FF);"></span></button>
                        <button class="preset-btn" data-preset="gold"><span>GOLD</span><span class="swatch" style="background:linear-gradient(to right,#B8860B,#F5D06A);"></span></button>
                        <button class="preset-btn" data-preset="ocean"><span>OCEAN</span><span class="swatch" style="background:linear-gradient(to right,#0066CC,#66CCFF);"></span></button>
                        <button class="preset-btn" data-preset="fire"><span>FIRE</span><span class="swatch" style="background:linear-gradient(to right,#FF4500,#FFD700);"></span></button>
                        <button class="preset-btn" data-preset="rainbow"><span>🌈 彩虹</span><span class="swatch" style="background:linear-gradient(to right,#FF0000,#FF7F00,#FFFF00,#00FF00,#0000FF,#8B00FF);"></span></button>
                    </div>
                </div>

                <hr class="divider">

                <!-- 分段颜色 -->
                <div id="segmentSettings"></div>

                <hr class="divider">

                <!-- 文字着色模式 -->
                <div class="field">
                    <div class="label" data-i18n="textMode">🌈 文字着色</div>
                    <div class="mode-group" id="textModeGroup">
                        <button class="mode-btn active" data-mode="gradient" data-i18n="gradient">渐变</button>
                        <button class="mode-btn" data-mode="solid" data-i18n="solid">纯色</button>
                    </div>
                    <div class="hint" id="solidColorHint" data-i18n="gradientHint">渐变模式：起始→结束</div>
                </div>

                <!-- 样式 -->
                <div class="field">
                    <div class="label" data-i18n="textStyle">✏️ 样式</div>
                    <div class="toggle-group">
                        <label class="toggle-item" data-style="bold"><input type="checkbox" id="styleBold"><span class="track"></span><span class="label-text"><b>B</b></span></label>
                        <label class="toggle-item" data-style="italic"><input type="checkbox" id="styleItalic"><span class="track"></span><span class="label-text"><i>I</i></span></label>
                        <label class="toggle-item" data-style="underline"><input type="checkbox" id="styleUnderline"><span class="track"></span><span class="label-text"><u>U</u></span></label>
                        <label class="toggle-item" data-style="strike"><input type="checkbox" id="styleStrike"><span class="track"></span><span class="label-text"><s>S</s></span></label>
                    </div>
                </div>

                <!-- 描边 -->
                <div class="field">
                    <div class="label" data-i18n="stroke">🖊️ 描边</div>
                    <div class="stroke-row">
                        <label class="toggle-item" data-style="stroke"><input type="checkbox" id="styleStroke"><span class="track"></span><span class="label-text" data-i18n="enable">启用</span></label>
                        <div class="mode-group" id="strokeModeGroup">
                            <button class="mode-btn active" data-mode="gradient" data-i18n="gradient">渐变</button>
                            <button class="mode-btn" data-mode="solid" data-i18n="solid">纯色</button>
                        </div>
                        <div class="range-wrap">
                            <span class="range-label">粗细</span>
                            <input type="range" id="strokeThickness" min="0.5" max="6" step="0.5" value="2">
                            <span class="range-val" id="strokeThicknessVal">2</span>
                        </div>
                    </div>

                    <div class="stroke-colors" id="strokeColorSet">
                        <span class="label-sm">起始</span>
                        <div class="color-picker-wrap"><input type="color" id="strokeStartColor" value="#692B64"><input type="text" id="strokeStartText" value="#692B64"></div>
                        <span class="label-sm">结束</span>
                        <div class="color-picker-wrap"><input type="color" id="strokeEndColor" value="#CBC6FF"><input type="text" id="strokeEndText" value="#CBC6FF"></div>
                    </div>

                    <div style="margin-top:6px;">
                        <div style="font-size:0.6rem;font-weight:500;text-transform:uppercase;letter-spacing:0.04em;color:var(--md-sys-color-on-surface-variant);margin-bottom:2px;" data-i18n="strokePresets">描边预设</div>
                        <div class="preset-grid-stroke" id="strokePresetGrid">
                            <button class="preset-btn-stroke" data-stroke="endurance"><span>ENDURANCE</span><span class="swatch-sm" style="background:linear-gradient(to right,#87292B,#F54B4E);"></span></button>
                            <button class="preset-btn-stroke" data-stroke="celestial"><span>CELESTIAL</span><span class="swatch-sm" style="background:linear-gradient(to right,#9E3862,#F25597);"></span></button>
                            <button class="preset-btn-stroke" data-stroke="voidbound"><span>VOIDBOUND</span><span class="swatch-sm" style="background:linear-gradient(to right,#8481A6,#CBC6FF);"></span></button>
                            <button class="preset-btn-stroke" data-stroke="gold"><span>GOLD</span><span class="swatch-sm" style="background:linear-gradient(to right,#B8860B,#F5D06A);"></span></button>
                            <button class="preset-btn-stroke" data-stroke="ocean"><span>OCEAN</span><span class="swatch-sm" style="background:linear-gradient(to right,#0066CC,#66CCFF);"></span></button>
                            <button class="preset-btn-stroke" data-stroke="fire"><span>FIRE</span><span class="swatch-sm" style="background:linear-gradient(to right,#FF4500,#FFD700);"></span></button>
                            <button class="preset-btn-stroke" data-stroke="rainbow"><span>🌈</span><span class="swatch-sm" style="background:linear-gradient(to right,#FF0000,#FF7F00,#FFFF00,#00FF00,#0000FF,#8B00FF);"></span></button>
                        </div>
                    </div>
                </div>

                <!-- 操作按钮 -->
                <div class="btn-group">
                    <button class="md-btn md-btn-outlined" onclick="resetAll()" data-i18n="reset">↺ 重置</button>
                </div>
            </div>

            <!-- ===== 右栏：预览 & 输出 ===== -->
            <div class="panel">
                <div class="panel-head">
                    <span class="icon">👁️</span>
                    <h2 data-i18n="preview">预览</h2>
                    <span class="pill">实时</span>
                </div>

                <!-- 预览 -->
                <div class="preview-box">
                    <div class="preview-text" id="previewText">ENDURANCE</div>
                </div>

                <!-- 代码输出 -->
                <div class="field">
                    <div class="label" data-i18n="codeOutput">📄 富文本代码</div>
                    <div class="output-box" id="outputCode">&lt;font color="#87292B"&gt;E&lt;/font&gt;...</div>
                </div>

                <!-- 操作按钮 -->
                <div class="btn-group">
                    <button class="md-btn md-btn-tonal" onclick="copyCode()" data-i18n="copyCode">📋 复制代码</button>
                    <button class="md-btn md-btn-outlined" onclick="copyPreview()" data-i18n="copyText">📄 复制纯文本</button>
                    <button class="md-btn md-btn-text" onclick="generateCode()" data-i18n="refresh">↻</button>
                </div>

                <!-- 脚注 -->
                <div class="footnote" data-i18n="footer">
                    💡 <b>使用说明</b><br>
                    文字和描边颜色独立，支持渐变/纯色。在 Roblox 中启用 <code>RichText</code> 即可。
                </div>
            </div>

        </div><!-- /main-grid -->

    </div><!-- /app -->

    <!-- ==========================================
    外部 JavaScript
    ========================================== -->
    <script src="script.js">
    </script>

    <script>
        // ============================================
        // 主题切换逻辑（深色模式）
        // ============================================
        (function() {
            const themeToggle = document.getElementById('themeToggle');
            const html = document.documentElement;

            // 检测系统偏好
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                html.setAttribute('data-theme', 'dark');
                themeToggle.textContent = '☀️';
            }

            themeToggle.addEventListener('click', function() {
                const currentTheme = html.getAttribute('data-theme');
                if (currentTheme === 'dark') {
                    html.removeAttribute('data-theme');
                    themeToggle.textContent = '🌙';
                } else {
                    html.setAttribute('data-theme', 'dark');
                    themeToggle.textContent = '☀️';
                }
            });
        })();

        // ============================================
        // 修复中英文切换中的提示文本
        // ============================================
        (function() {
            const originalInit = window.initI18n || function() {};
            const langToggle = document.getElementById('langToggle');
            const solidColorHint = document.getElementById('solidColorHint');
            let currentLang = 'zh';

            function updateHint(lang, mode) {
                const dict = window.i18nMap ? window.i18nMap[lang] : null;
                if (!dict) return;
                const key = mode === 'solid' ? 'solidHint' : 'gradientHint';
                if (dict[key]) {
                    solidColorHint.innerHTML = dict[key];
                }
            }

            // 监听语言切换
            langToggle.addEventListener('click', function(e) {
                const btn = e.target.closest('button');
                if (!btn || !btn.dataset.lang) return;
                currentLang = btn.dataset.lang;
                // 延迟执行以确保其他 i18n 已更新
                setTimeout(() => {
                    const textMode = document.querySelector('#textModeGroup .active');
                    const mode = textMode ? textMode.dataset.mode : 'gradient';
                    updateHint(currentLang, mode);
                }, 50);
            });

            // 监听文字模式切换
            document.addEventListener('click', function(e) {
                const btn = e.target.closest('#textModeGroup .mode-btn');
                if (!btn) return;
                setTimeout(() => {
                    const mode = btn.dataset.mode;
                    updateHint(currentLang, mode);
                }, 20);
            });

            // 暴露更新函数
            window.updateHint = updateHint;
            window.setCurrentLang = function(lang) { currentLang = lang; };
        })();
    </script>

</body>
</html>
